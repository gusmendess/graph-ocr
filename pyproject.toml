[project]
name = "graph-ocr"
version = "0.1.0"
description = "Busca reversa de comprovantes (sha256 -> phash -> vetor multimodal) e busca de imagens por linguagem natural (SigLIP2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "pytesseract>=0.3.10",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "anthropic>=0.40",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "pylint>=3.0"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "integration_tests"]
pythonpath = ["."]
# por padrão só os testes unitários (rápidos, sem modelos nem rede); `pytest -m integration` roda os outros
addopts = "-m 'not integration'"
markers = ["integration: usa os modelos reais (RapidOCR, DINOv2, SigLIP2) já baixados em .cache/models; não roda por padrão"]
