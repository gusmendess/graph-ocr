[project]
name = "graph-ocr"
version = "0.1.0"
description = "Detecção de comprovantes adulterados: cascata sha256 -> phash -> OCR (bbox/IoU) + grafo k-NN"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "networkx>=3.3",
    "matplotlib>=3.8",
    "pytesseract>=0.3.10",
    "rapidocr>=3.0",
    "onnxruntime>=1.18",
    "anthropic>=0.40",
    "scipy>=1.11",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27", "pylint>=3.0"]

[tool.pytest.ini_options]
testpaths = ["app/tests", "integration_tests"]
pythonpath = ["."]
